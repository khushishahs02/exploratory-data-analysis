services:
  - type: web
    name: healthwealth-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6

  - type: web
    name: healthwealth-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: healthwealth-backend
          envVarKey: RENDER_EXTERNAL_URL